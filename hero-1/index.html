<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clon Scalestream - Hero Section</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white min-h-screen flex flex-col justify-between antialiased font-sans">

  <header class="flex items-center justify-between w-full px-8 py-5 bg-white">
    
    <div class="flex items-center space-x-2 cursor-pointer">
      <div class="w-8 h-8  flex items-center justify-center text-white font-bold text-xs">
        <img src="assets/rocket-svgrepo-com.svg" alt="" srcset="">
      </div>
      <span class="text-xl font-bold tracking-tight text-gray-900">
        ScaleStream<span class="text-lime-400">.</span>
      </span>
    </div>

    <nav class="hidden md:flex items-center space-x-6 text-sm font-medium text-gray-700">
      <a href="#" class="text-black font-semibold hover:text-gray-900">Home</a>
      <a href="#" class="hover:text-black transition-colors">Startups</a>
      <a href="#" class="hover:text-black transition-colors">Investors</a>
      <a href="#" class="hover:text-black transition-colors">Service Providers</a>
      <a href="#" class="hover:text-black transition-colors">Events</a>
      <a href="#" class="hover:text-black transition-colors">Explore</a>
    </nav>

    <div class="flex items-center space-x-4 text-sm font-medium">
      <a href="#" class="text-gray-900 hover:text-black">Login</a>
      <a href="#" class="bg-black text-white px-5 py-2.5 rounded-full hover:bg-gray-800 transition-all text-center">
        Sign Up
      </a>
    </div>

  </header>

  <main class="mx-8 my-4 bg-[#FAF9EE] rounded-[2.5rem] px-8 py-12 md:px-16 md:py-20 flex-grow">
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-12 items-center max-w-7xl mx-auto h-full">
      
      <div class="flex flex-col space-y-6 max-w-xl">
        
        <div class="flex items-center space-x-2">
          <span class="bg-white text-gray-800 text-xs font-semibold px-4 py-1.5 rounded-md shadow-sm border border-gray-100">
            Digital Success
          </span>
        </div>

        <h1 class="text-5xl md:text-6xl font-bold text-gray-900 leading-[1.1] tracking-tight">
          Pitch to Investors <br class="hidden sm:inline" />
          Directly on <br />
          ScaleStream
        </h1>

        <div class="flex items-center -space-x-3 pt-2">
          <img class="w-10 h-10 rounded-full border-2 border-[#f1f5f9] object-cover" src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=100&q=80" alt="User 1">
          <img class="w-10 h-10 rounded-full border-2 border-[#f1f5f9] object-cover" src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=100&q=80" alt="User 2">
          <img class="w-10 h-10 rounded-full border-2 border-[#f1f5f9] object-cover" src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=100&q=80" alt="User 3">
        </div>

        <div class="flex flex-wrap items-center gap-4 pt-4">
          <button class="bg-[#bbf7d0] hover:bg-[#9bf4b8] text-gray-900 font-semibold px-6 py-3.5 rounded-xl transition-all shadow-sm">
            Create Startup Page
          </button>
          <button class="text-gray-900 hover:text-black font-semibold px-4 py-3 transition-colors">
            Become an Investor
          </button>
        </div>

      </div>

      <div class="w-full max-w-md lg:max-w-lg justify-self-center lg:justify-self-end">
        <img src="https://imgs.search.brave.com/2fuWId6aFFnMOPUI-c80l4Pqn3kEDQIv5KfnCMpWQcY/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly9pbWcu/bWFnbmlmaWMuY29t/L3ZlY3Rvci1ncmF0/aXMvaWx1c3RyYWNp/b24tcGxhbmEtY2hh/cmxlcy1kYXJ3aW5f/NTI2ODMtMTAwMzUz/LmpwZz90PXN0PTE3/ODA0MjEzNjl-ZXhw/PTE3ODA0MjQ5Njl-/aG1hYz0xNmNlNzZm/M2I1YTQwMDUxMTk1/OWZjYjlmNjZmNDZj/ZDMwZWMwYWNjNGNi/ZDdjMmNjOWZiZTU3/NGY0OTQwNjM5" alt="ScaleStream Illustration" class="w-full h-auto object-contain" />
      </div>

    </div>
  </main>

  <section class="mx-8 my-6 bg-[#0b0f17] rounded-[2rem] px-8 py-10">
    <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-8 items-center justify-items-center max-w-7xl mx-auto">
      
      <div class="flex items-center space-x-2 text-white opacity-80 hover:opacity-100 transition-opacity cursor-pointer">
        <span class="text-lg font-semibold tracking-wide">Streamlit</span>
      </div>

      <div class="text-white text-2xl font-bold italic opacity-80 hover:opacity-100 transition-opacity cursor-pointer tracking-tighter">
        intel<span class="text-xs not-italic align-top">®</span>
      </div>

      <div class="text-white text-xl font-bold tracking-[0.2em] opacity-80 hover:opacity-100 transition-opacity cursor-pointer uppercase">
        Sonos
      </div>

      <div class="text-white text-lg font-mono font-bold tracking-widest opacity-80 hover:opacity-100 transition-opacity cursor-pointer uppercase">
        Squire
      </div>

      <div class="col-span-2 sm:col-span-1 text-white text-xl font-extrabold opacity-80 hover:opacity-100 transition-opacity cursor-pointer tracking-tight">
        Green<span class="font-light text-gray-400">LIGHT</span>
      </div>

    </div>
  </section>

</body>
</html>
